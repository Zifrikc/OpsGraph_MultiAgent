name: opsgraph
services:
  falkordb:
    image: falkordb/falkordb:v4.12.0
    environment:
      REDIS_PASSWORD: ${FALKORDB_PASSWORD:?Run scripts/setup.ps1 first}
      REDISCLI_AUTH: ${FALKORDB_PASSWORD}
    entrypoint: ["sh", "-c"]
    command: ["exec redis-server --loadmodule /var/lib/falkordb/bin/falkordb.so --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --dir /data"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["graph-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      falkordb:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:?Run scripts/setup.ps1 first}
      PORT: 3000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on: [api]
volumes:
  graph-data:
